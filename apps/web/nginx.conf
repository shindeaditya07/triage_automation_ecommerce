server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # One origin: the API is reached through /api so login cookies stay same-site.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location / {
    try_files $uri /index.html;
  }
}
