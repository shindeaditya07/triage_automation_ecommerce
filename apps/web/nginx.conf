server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # One origin: the API is reached through /api so login cookies stay same-site.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Security headers (docs/AGENTS.md section 7) for the pages and assets. /api/ is not listed: the
  # API sets its own. The same values for a Render Static Site: guides/security-headers.md.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
  }
}
