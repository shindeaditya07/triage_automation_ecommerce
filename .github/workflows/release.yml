name: Release

# Runs when a version tag (v*) is pushed. The tagged commit must already be on main. The deploy
# job uses the 'production' environment, so it waits for the required reviewer's approval click.
# After deploying it runs the signed-intake smoke test, then publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tagged commit must be reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge the release PR first, then tag the merge commit."
            exit 1
          fi

  build:
    name: Build & Push Images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      mock_image: ${{ steps.meta.outputs.mock_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names and tag
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME}"
          echo "api_image=${REGISTRY}/${repo}/replydesk-api:${tag}" >> "$GITHUB_OUTPUT"
          echo "mock_image=${REGISTRY}/${repo}/replydesk-mock-store:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api_image }}

      - name: Build and push mock-store image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/mock-store/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.mock_image }}

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      API_HOOK: ${{ secrets.RENDER_PROD_API_DEPLOY_HOOK }}
      MOCK_HOOK: ${{ secrets.RENDER_PROD_MOCK_DEPLOY_HOOK }}
      PROD_API_URL: ${{ vars.PROD_API_URL }}
      SYNTHETIC_CHECK_HMAC_SECRET: ${{ secrets.SYNTHETIC_CHECK_HMAC_SECRET }}
    steps:
      - name: Check production configuration
        run: |
          missing=0
          [ -n "$API_HOOK" ] || { echo "::error::Secret RENDER_PROD_API_DEPLOY_HOOK is not set in the 'production' environment"; missing=1; }
          [ -n "$MOCK_HOOK" ] || { echo "::error::Secret RENDER_PROD_MOCK_DEPLOY_HOOK is not set in the 'production' environment"; missing=1; }
          [ -n "$PROD_API_URL" ] || { echo "::error::Variable PROD_API_URL is not set in the 'production' environment"; missing=1; }
          [ -n "$SYNTHETIC_CHECK_HMAC_SECRET" ] || { echo "::error::Secret SYNTHETIC_CHECK_HMAC_SECRET is not set in the 'production' environment"; missing=1; }
          exit "$missing"

      - name: Deploy mock store
        env:
          IMAGE: ${{ needs.build.outputs.mock_image }}
        run: |
          echo "::add-mask::$MOCK_HOOK"
          curl -fsS -X POST "${MOCK_HOOK}&imgURL=$(jq -rn --arg u "$IMAGE" '$u|@uri')" > /dev/null
          echo "Triggered mock-store deploy of $IMAGE"

      - name: Deploy API
        env:
          IMAGE: ${{ needs.build.outputs.api_image }}
        run: |
          echo "::add-mask::$API_HOOK"
          curl -fsS -X POST "${API_HOOK}&imgURL=$(jq -rn --arg u "$IMAGE" '$u|@uri')" > /dev/null
          echo "Triggered API deploy of $IMAGE"

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Release smoke test (waits for /readyz, then signed intake)
        run: uv run python -m scripts.synthetic_check --api-url "${PROD_API_URL%/}"

  publish:
    name: Publish GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          cat > notes.md <<'NOTES'
          ## Known limit: the recall gate is not met

          The project's escalation-recall gate is 0.95. The best live measurement so far is 0.893 on
          28 escalation tickets (two full runs, README "Results"). This release ships with that gap,
          and with a same-family model judging drafts. Every reply is a draft a human approves
          before it is sent; nothing is sent automatically.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes "${flags[@]}"
