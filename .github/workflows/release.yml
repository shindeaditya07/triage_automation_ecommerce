name: Release

# Runs when a version tag (v*) is pushed. The tagged commit must already be on main. It builds
# version-tagged images and publishes a GitHub Release. It deploys nothing: staging is the only
# running environment and deploys from develop (staging.yml). Run the smoke test by hand against
# staging (docs/runbook.md, "Release smoke test").
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tagged commit must be reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge the release PR first, then tag the merge commit."
            exit 1
          fi

  build:
    name: Build & Push Images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      mock_image: ${{ steps.meta.outputs.mock_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names and tag
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME}"
          echo "api_image=${REGISTRY}/${repo}/replydesk-api:${tag}" >> "$GITHUB_OUTPUT"
          echo "mock_image=${REGISTRY}/${repo}/replydesk-mock-store:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api_image }}

      - name: Build and push mock-store image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/mock-store/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.mock_image }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          repo="${GITHUB_REPOSITORY,,}"
          cat > notes.md <<'NOTES'
          ## Known limit: the recall gate is not met

          The project's escalation-recall gate is 0.95. The best live measurement so far is 0.893 on
          28 escalation tickets (two full runs, README "Results"). This release ships with that gap,
          and with a same-family model judging drafts. Every reply is a draft a human approves
          before it is sent; nothing is sent automatically.

          ## Deployment

          This release is not deployed to a separate production environment. The only running
          environment is staging, which deploys from `develop`. Images for this version are at
          `ghcr.io/REPO/replydesk-api:TAG` and `ghcr.io/REPO/replydesk-mock-store:TAG`.
          NOTES
          sed -i "s|REPO|${repo}|g; s|TAG|${GITHUB_REF_NAME}|g" notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes "${flags[@]}"
