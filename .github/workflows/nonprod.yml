name: Non-prod Deploy

# Runs when a release/* branch is pushed. This is the last check before production: the exact
# commit that will be tagged is deployed to the non-prod services and must answer /healthz.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

concurrency:
  group: nonprod-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      mock_image: ${{ steps.meta.outputs.mock_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names and tag
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="nonprod-${GITHUB_SHA}"
          echo "api_image=${REGISTRY}/${repo}/replydesk-api:${tag}" >> "$GITHUB_OUTPUT"
          echo "mock_image=${REGISTRY}/${repo}/replydesk-mock-store:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.api_image }}

      - name: Build and push mock-store image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/mock-store/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.mock_image }}

  deploy:
    name: Deploy to Non-prod
    needs: build
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      API_HOOK: ${{ secrets.RENDER_NONPROD_API_DEPLOY_HOOK }}
      MOCK_HOOK: ${{ secrets.RENDER_NONPROD_MOCK_DEPLOY_HOOK }}
      NONPROD_API_URL: ${{ vars.NONPROD_API_URL }}
    steps:
      - name: Check non-prod configuration
        run: |
          missing=0
          [ -n "$API_HOOK" ] || { echo "::error::Secret RENDER_NONPROD_API_DEPLOY_HOOK is not set in the 'nonprod' environment"; missing=1; }
          [ -n "$MOCK_HOOK" ] || { echo "::error::Secret RENDER_NONPROD_MOCK_DEPLOY_HOOK is not set in the 'nonprod' environment"; missing=1; }
          [ -n "$NONPROD_API_URL" ] || { echo "::error::Variable NONPROD_API_URL is not set in the 'nonprod' environment"; missing=1; }
          exit "$missing"

      - name: Deploy mock store
        env:
          IMAGE: ${{ needs.build.outputs.mock_image }}
        run: |
          echo "::add-mask::$MOCK_HOOK"
          curl -fsS -X POST "${MOCK_HOOK}&imgURL=$(jq -rn --arg u "$IMAGE" '$u|@uri')" > /dev/null
          echo "Triggered mock-store deploy of $IMAGE"

      - name: Deploy API
        env:
          IMAGE: ${{ needs.build.outputs.api_image }}
        run: |
          echo "::add-mask::$API_HOOK"
          curl -fsS -X POST "${API_HOOK}&imgURL=$(jq -rn --arg u "$IMAGE" '$u|@uri')" > /dev/null
          echo "Triggered API deploy of $IMAGE"

      - name: Wait for non-prod to answer
        run: |
          url="${NONPROD_API_URL%/}/healthz"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 "$url" > /dev/null; then
              echo "Non-prod answered at $url"
              exit 0
            fi
            echo "Waiting for $url (attempt $i/40)"
            sleep 10
          done
          echo "::error::Non-prod did not answer within about 400 seconds. Check the service logs on Render."
          exit 1
