# Capitalised words that may appear mid-sentence without being in the order, the message or a cited
# policy: the store's own wording, days and months, payment and shipping terms.
allowed_names:
  - "I"
  - "OK"
  - "COD"
  - "UPI"
  - "IST"
  - "GST"
  - "PIN"
  - "EMI"
  - "RD"
  - "TRK"
  - "INR"
  - "Rs"
  - "India"
  - "Indian"
